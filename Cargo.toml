[workspace]
resolver = "2"
members = ["crates/shinbun-layout", "crates/shinbun-layout-wasm", "crates/shinbun-layout-exact"]
default-members = ["crates/shinbun-layout"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/kamimen/shinbun-layout"
rust-version = "1.80"

[profile.release]
lto = true
codegen-units = 1

[profile.test]
opt-level = 2

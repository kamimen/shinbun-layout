[package]
name = "shinbun-layout"
description = "Automatic layout of Japanese newspaper pages (新聞の紙面): places articles on the column grid used by shinbun-css"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
keywords = ["layout", "newspaper", "japanese", "typesetting"]
categories = ["algorithms"]

[dependencies]
shinbun-layout-core = { path = "../shinbun-layout-core", version = "0.1.0" }
shinbun-layout-solve = { path = "../shinbun-layout-solve", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }

[dev-dependencies]
proptest = "1"
